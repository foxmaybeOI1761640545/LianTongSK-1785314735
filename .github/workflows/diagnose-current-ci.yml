name: Diagnose Current CI Failure

on:
  push:
    branches:
      - future/1785754980/refine-region-shapes-and-focus-scale

permissions:
  contents: write

jobs:
  diagnose:
    if: >-
      github.actor != 'github-actions[bot]' &&
      contains(github.event.head_commit.message, 'ci: diagnose current workflow failure')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: future/1785754980/refine-region-shapes-and-focus-scale
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Capture lint and unit test results
        shell: bash
        run: |
          set +e
          {
            echo '# CI diagnostic'
            echo
            echo '## Lint'
            npm run lint
            lint_status=$?
            echo
            echo "LINT_EXIT=$lint_status"
            echo
            echo '## Unit tests'
            npm run test:unit
            unit_status=$?
            echo
            echo "UNIT_EXIT=$unit_status"
            echo
            echo "OVERALL_EXIT=$(( lint_status != 0 || unit_status != 0 ))"
          } > .ci-diagnostic.txt 2>&1
          cat .ci-diagnostic.txt
          exit 0

      - name: Commit diagnostic
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .ci-diagnostic.txt
          git commit -m 'ci: record workflow diagnostic [skip ci]'
          git push origin HEAD:future/1785754980/refine-region-shapes-and-focus-scale
