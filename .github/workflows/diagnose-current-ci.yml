name: Diagnose Current CI Failure

on:
  push:
    branches:
      - future/1785754980/refine-region-shapes-and-focus-scale

permissions:
  contents: write

jobs:
  diagnose:
    if: >-
      github.actor != 'github-actions[bot]' &&
      contains(github.event.head_commit.message, 'ci: diagnose current workflow failure')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: future/1785754980/refine-region-shapes-and-focus-scale
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Capture remaining verification results
        shell: bash
        run: |
          set +e
          {
            echo '# CI diagnostic'
            echo
            echo '## Lint'
            npm run lint
            lint_status=$?
            echo
            echo "LINT_EXIT=$lint_status"
            echo
            echo '## Unit tests'
            npm run test:unit
            unit_status=$?
            echo
            echo "UNIT_EXIT=$unit_status"
            echo
            echo '## Build'
            npm run build
            build_status=$?
            echo
            echo "BUILD_EXIT=$build_status"
            echo
            echo '## Verify build'
            npm run verify:build
            verify_status=$?
            echo
            echo "VERIFY_BUILD_EXIT=$verify_status"
            echo
            echo '## Install Chromium'
            npx playwright install --with-deps chromium
            chromium_status=$?
            echo
            echo "CHROMIUM_EXIT=$chromium_status"
            echo
            echo '## Browser tests'
            npm run test:e2e
            e2e_status=$?
            echo
            echo "E2E_EXIT=$e2e_status"
            echo
            echo "OVERALL_EXIT=$(( lint_status != 0 || unit_status != 0 || build_status != 0 || verify_status != 0 || chromium_status != 0 || e2e_status != 0 ))"
          } > .ci-diagnostic.txt 2>&1
          cat .ci-diagnostic.txt
          exit 0

      - name: Commit diagnostic
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .ci-diagnostic.txt
          git commit -m 'ci: record extended workflow diagnostic [skip ci]'
          git push origin HEAD:future/1785754980/refine-region-shapes-and-focus-scale
