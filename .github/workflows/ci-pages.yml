name: Verify and Deploy Audit Dashboard

on:
  push:
    branches:
      - main
      - 'future/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audit-dashboard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, test, build and browser smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit

      - name: Build
        run: npm run build

      - name: Verify build artifact
        run: npm run verify:build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser smoke
        run: npm run test:e2e

      - name: Upload browser report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-report-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  pages-artifact:
    name: Build Pages artifact
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install and build
        run: npm ci && npm run build && npm run verify:build
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: Deploy current branch to Pages
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: pages-artifact
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v5

  remote-smoke:
    name: Verify deployed Pages
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies and Chromium
        run: npm ci && npx playwright install --with-deps chromium
      - name: Wait for Pages and run remote smoke
        shell: bash
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          set -euo pipefail
          for attempt in {1..30}; do
            if curl --fail --silent --show-error --location "$PAGE_URL" >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              echo "Pages did not become available in time" >&2
              exit 1
            fi
            sleep 10
          done
          npm run smoke:remote -- "$PAGE_URL"
      - name: Upload deployed dashboard screenshot
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: deployed-dashboard-${{ github.sha }}
          path: remote-artifacts/
          if-no-files-found: error
          retention-days: 14
