name: Sync User Experience Dashboard

on:
  push:
    branches:
      - future/1785688500/sync-user-experience-dashboard

permissions:
  contents: write

concurrency:
  group: sync-user-experience-dashboard
  cancel-in-progress: false

jobs:
  migrate-and-verify:
    if: github.actor != 'github-actions[bot]' && contains(github.event.head_commit.message, 'ci: stage dashboard migration')
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout destination branch
        uses: actions/checkout@v4
        with:
          ref: future/1785688500/sync-user-experience-dashboard
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Migrate and verify
        id: migration
        shell: bash
        run: |
          set +e
          set -o pipefail
          (
            set -euo pipefail
            git clone --depth 1 \
              --branch future/1785685535/UserExperienceValueDashboard \
              https://github.com/foxmaybeOI1761640545/LianTongSK-1785306945.git \
              /tmp/user-experience-dashboard
            rsync -a --delete \
              --exclude '.git/' \
              --exclude '.github/workflows/' \
              --exclude '.github/scripts/' \
              /tmp/user-experience-dashboard/ ./
            python .github/scripts/sync_user_experience_dashboard.py
            npm ci
            npm run lint
            npm run test:unit
            npx playwright install --with-deps chromium
            npm run test:e2e
            npm run build
            npm run verify:build
            git diff --check
            git status --short
            git diff --stat
          ) 2>&1 | tee migration.log
          migration_status=${PIPESTATUS[0]}
          echo "status=${migration_status}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Commit migration result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          if [ "${{ steps.migration.outputs.status }}" = "0" ]; then
            rm -f migration.log
            rm -f .github/workflows/sync-user-experience-dashboard.yml
            rm -f .github/scripts/sync_user_experience_dashboard.py
            rmdir .github/scripts 2>/dev/null || true
            git add -A
            git commit -m 'feat(dashboard): sync user experience value modules'
            git push origin HEAD:future/1785688500/sync-user-experience-dashboard
          else
            cp migration.log /tmp/dashboard-migration.log
            git reset --hard HEAD
            git clean -fdx
            {
              echo '# Dashboard migration failed'
              echo
              echo 'The one-time migration runner returned a non-zero status. Log tail:'
              echo
              echo '```text'
              tail -n 300 /tmp/dashboard-migration.log
              echo '```'
            } > MIGRATION_FAILED.md
            git add MIGRATION_FAILED.md
            git commit -m 'ci: record dashboard migration failure'
            git push origin HEAD:future/1785688500/sync-user-experience-dashboard
            exit 1
          fi
