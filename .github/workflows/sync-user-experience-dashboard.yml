name: Sync User Experience Dashboard

on:
  push:
    branches:
      - future/1785688500/sync-user-experience-dashboard

permissions:
  contents: write

concurrency:
  group: sync-user-experience-dashboard
  cancel-in-progress: false

jobs:
  migrate-and-verify:
    if: github.actor != 'github-actions[bot]' && contains(github.event.head_commit.message, 'ci: stage dashboard migration')
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout destination branch
        uses: actions/checkout@v4
        with:
          ref: future/1785688500/sync-user-experience-dashboard
          fetch-depth: 0

      - name: Clone requested dashboard version
        run: |
          git clone --depth 1 \
            --branch future/1785685535/UserExperienceValueDashboard \
            https://github.com/foxmaybeOI1761640545/LianTongSK-1785306945.git \
            /tmp/user-experience-dashboard

      - name: Synchronize modules and data
        run: |
          rsync -a --delete \
            --exclude '.git/' \
            --exclude '.github/workflows/' \
            --exclude '.github/scripts/' \
            /tmp/user-experience-dashboard/ ./
          python .github/scripts/sync_user_experience_dashboard.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e

      - name: Build
        run: npm run build

      - name: Verify build
        run: npm run verify:build

      - name: Remove one-time migration automation
        run: |
          rm -f .github/workflows/sync-user-experience-dashboard.yml
          rm -f .github/scripts/sync_user_experience_dashboard.py
          rmdir .github/scripts 2>/dev/null || true

      - name: Validate diff
        run: |
          git status --short
          git diff --check
          git diff --stat

      - name: Commit synchronized dashboard
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat(dashboard): sync user experience value modules'
          git push origin HEAD:future/1785688500/sync-user-experience-dashboard
